version: '3.9'

# ============================================
# Dedicated AWS EC2 instance — no other projects on this box (moved off the
# old shared VPS after it went down with the database dropped from under us).
#   1. No `mysql` service here — the database is AWS RDS (managed, own
#      security group, automated backups), reachable over the VPC by
#      DATABASE_HOST (the RDS endpoint, set in .env). Not a container on
#      this host, so nothing running here can `DROP DATABASE` it by
#      accident the way the old shared self-hosted container could.
#   2. No own `nginx` service — ports 80/443 are owned by an nginx
#      installed directly on the host (not Docker). Add a server block to
#      that host nginx for silver14nail.com / admin.silver14nail.com /
#      api.silver14nail.com, proxying to 127.0.0.1:4200 / :4201 / :3000.
# ============================================

services:
  # ============================================
  # API Service (NestJS)
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: silver14-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      STOREFRONT_URL: ${STOREFRONT_URL:-https://silver14nail.com}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      TOKEN_EXPIRES: ${TOKEN_EXPIRES:-86400}
      REFRESH_TOKEN_EXPIRES: ${REFRESH_TOKEN_EXPIRES:-604800}
      DATABASE_TYPE: mysql
      # AWS RDS endpoint — set in .env, e.g.
      # silver14-db.xxxxx.us-east-1.rds.amazonaws.com
      DATABASE_HOST: ${DATABASE_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-silver14_nail_db}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PORT: 3306
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      ONEPAY_ENV: ${ONEPAY_ENV:-sandbox}
      ONEPAY_MERCHANT_ID: ${ONEPAY_MERCHANT_ID}
      ONEPAY_ACCESS_CODE: ${ONEPAY_ACCESS_CODE}
      ONEPAY_HASH_KEY: ${ONEPAY_HASH_KEY}
      ONEPAY_USER: ${ONEPAY_USER}
      ONEPAY_PASSWORD: ${ONEPAY_PASSWORD}
      ONEPAY_TITLE: ${ONEPAY_TITLE:-Silver14 Nail — Thanh toán OnePAY}
      ONEPAY_API_URL: ${ONEPAY_API_URL:-https://api.silver14nail.com/api}
    ports:
      - "3000:3000"
    networks:
      - silver14-network
    volumes:
      - ./apps/api/.env:/app/.env:ro

  # ============================================
  # Storefront Service (Next.js)
  # ============================================
  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      target: storefront
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time —
      # setting them under `environment:` below has no effect on what
      # already-built output sends to the browser. Must be a real public
      # URL here (not the internal `api:3000` hostname), since this runs in
      # the visitor's browser, outside the Docker network.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://silver14nail.com/api}
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:-https://silver14nail.com}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
    container_name: silver14-storefront
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4200
    ports:
      - "4200:4200"
    depends_on:
      - api
    networks:
      - silver14-network

  # ============================================
  # Admin Service (Next.js)
  # ============================================
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
      # Same NEXT_PUBLIC_* build-time-inlining caveat as the storefront
      # service above — see its comment.
      args:
        NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:-https://silver14nail.com}
    container_name: silver14-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4201
      API_URL: ${API_URL:-http://api:3000}
      STOREFRONT_INTERNAL_URL: ${STOREFRONT_INTERNAL_URL:-http://storefront:4200}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      MYMEMORY_EMAIL: ${MYMEMORY_EMAIL}
    ports:
      - "4201:4201"
    depends_on:
      - api
    networks:
      - silver14-network

  # ============================================
  # Database Migration (one-off — NOT started by `docker-compose up`)
  # ============================================
  # The `api` service above only contains the compiled webpack bundle
  # (dist/apps/api) + node_modules — no package.json, no `src/`, so
  # `ts-node`-based TypeORM migrations can't run inside it. This uses the
  # `source` stage instead, which has the full monorepo source and all
  # deps installed but skips building any app (migrations run straight off
  # `src/` via ts-node, so no build step was ever needed here). Run
  # explicitly: `docker-compose --profile migrate run --rm migrate`
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: source
    container_name: silver14-migrate
    working_dir: /app/apps/api
    entrypoint: ["pnpm", "run", "db:migrate"]
    environment:
      DATABASE_TYPE: mysql
      DATABASE_HOST: ${DATABASE_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-silver14_nail_db}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PORT: 3306
    volumes:
      - ./apps/api/.env:/app/apps/api/.env:ro
    networks:
      - silver14-network
    profiles:
      - migrate

# ============================================
# Networks
# ============================================
networks:
  silver14-network:
    driver: bridge
